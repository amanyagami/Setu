[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/transport",
    "crates/spike0",
    "crates/capture-linux",
    "crates/capture-win",
    "crates/capture-android",
    "crates/codec",
    "crates/control-plane",
]

[workspace.package]
version = "0.1.0-dev"
edition = "2021"
license = "MIT OR Apache-2.0"
authors = ["Setu Team"]
repository = "https://github.com/setu-remote-desktop/setu"
homepage = "https://setu.io"
description = "Cross-platform remote desktop with QUIC transport and capability-probed capture"

[workspace.dependencies]
# Core dependencies
thiserror = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tokio = { version = "1.35", features = ["full"] }
bytes = "1.5"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Crypto
ring = "0.17"
zeroize = "1.7"
sha2 = "0.10"
blake3 = "1.5"
hmac = "0.12"
chrono = "0.4"
uuid = { version = "1.6", features = ["v4", "serde"] }
base64 = "0.21"

# QUIC
quinn = "0.10"
rustls = "0.21"

# Control Plane
axum = { version = "0.7", features = ["ws"] }
tower = "0.4"
tower-http = { version = "0.5", features = ["cors", "trace"] }
sqlx = { version = "0.7", features = ["runtime-tokio-rustls", "postgres", "uuid"] }
rustls-pemfile = "2.0"
hyper-util = "0.1"
config = "0.14"
opentelemetry = "0.21"
opentelemetry-otlp = "0.14"
prost = "0.12"

# Testing
criterion = "0.5"
proptest = "1.4"

# Platform-specific (optional)
libc = "0.2"
windows-sys = { version = "0.52", features = ["Win32_Graphics_Dxgi", "Win32_Graphics_Direct3D11"] }

[profile.release]
lto = true
codegen-units = 1
opt-level = 3
strip = true

[profile.bench]
inherits = "release"
