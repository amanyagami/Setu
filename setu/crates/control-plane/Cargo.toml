[package]
name = "setu-control-plane"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "Setu Control Plane: Signaling, Identity Registry, and Relay Coordination"

[dependencies]
# Core Setu types
setu-core = { path = "../core" }

# Async Runtime
tokio = { workspace = true }
axum = { version = "0.7", features = ["ws", "macros"] }
tower = "0.4"
tower-http = { version = "0.5", features = ["cors", "trace"] }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }
prost = { workspace = true }

# Crypto & Identity
ring = "0.17" # For fast Ed25519 verification in hot path
rustls = { version = "0.23", features = ["ring"] }
tokio-rustls = "0.26"

# Database (Device Registry)
sqlx = { version = "0.7", features = ["runtime-tokio-rustls", "postgres", "uuid"] }
uuid = { workspace = true }

# Observability
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
opentelemetry = { workspace = true }
opentelemetry-otlp = { workspace = true }

# Config
config = "0.14"

[dev-dependencies]
tokio-test = "0.4"
reqwest = { version = "0.11", features = ["json"] }
